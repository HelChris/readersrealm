<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed | ReadersRealm</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" type="module"></script>
</head>

<body class="min-h-screen bg-sky bg-cover bg-center bg-no-repeat flex flex-col">
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto py-3 px-4 sm:px-6 lg:px-8 flex justify-between items-end">
      <div class="flex items-end">
        <a href="../feed/index.html"><img src="/images/readersrealm-logov3.png" class="h-24"></a>
      </div>
      <div>
        <nav class="flex  space-x-4">
          <a href="#" class="active text-gray-600 hover:text-gray-900">Feed</a>
          <a href="../profile/index.html" class="text-gray-600 hover:text-gray-900">Profile</a>
          <a href="#" id="logout-button" class="text-gray-600 hover:text-gray-900">Sign out</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 flex-grow">

    <section class="m-2">
      <div class="mb-4">
        <input type="text" placeholder="Search posts... (try author:name)"
          class="w-full px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-teal-600 focus:border-teal-600">
      </div>
      <div class="mb-4 flex justify-between items-center">
        <div>
          <label for="sort" class="block text-sm font-medium text-gray-700">Sort by:</label>
          <select id="sort" name="sort"
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-teal-600 focus:border-teal-600 sm:text-sm rounded-md">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
        <button id="new-post-button"
          class="bg-teal-900 text-white py-2 px-4 rounded-md hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-900">Create
          Post</button>
      </div>
    </section>
    <section>
      <h1 class="text-2xl font-semibold text-gray-900 text-center text-balance">Journey through the
        pages together</h1>
      <!-- Posts List -->
      <div id="display-container"></div>
      <div id="postsList" class="grid grid-cols-1 m-4 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      </div>
    </section>

    <section>
      <!-- CREATE NEW POST FORM -->
      <div class="bg-white p-4 rounded shadow mt-8 w-full max-w-lg mx-auto" id="create-post-container">
        <div id="create-post-message"></div>
        <div id="create-post"></div>
      </div>
    </section>

  </main>
  <!-- Footer -->
  <footer class="bg-white shadow mt-8">
    <div class="container mx-auto px-4 py-4 text-center">
      &copy; 2024 ReadersRealm
    </div>
  </footer>
</body>

</html>
